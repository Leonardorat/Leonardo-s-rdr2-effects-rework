; Blood and Wounds 1.5 - Publish (Vulkan / DX12)
; Restart the game after editing. 1 = on, 0 = off.

[General]
Enabled=1

; Automatic fixed packs; firearms, arrows and explosives.
[AutomaticWounds]
Enabled=1
; Extra fixed wound/blood packs; bullet variety is independent.
FixedDecals=1
; NPC firearm/arrow hits use dynamic blood only; explosives and player grazes remain.
DynamicBloodOnlyForShooting=1
; Player fixed wounds use the graze shortlist and clean after bathing or immersion.
Player=1
NPCs=1
Corpses=1
BoundedProgression=1
; Seconds after a witnessed death when fixed packs remain eligible.
FixedDecalDeathGraceSeconds=1.5

; Dynamic blood at impacts; 29 uses the regional profiles below.
[DynamicWounds]
Enabled=1
; Extra blood only; blood within bullet wound textures remains.
BloodEnabled=1
BloodComponent=29
; Extra blood applications per head surface; range 1-12.
HeadBloodLayers=3

; Bullet wound variety and three-tier progression. Distances are metres.
[WoundVariations]
Enabled=1
; Ordinary bullet holes on NPC torso; 1 = original size. Shotguns unchanged.
TorsoBulletHoleSizeMultiplier=1.25
HandgunMaxMeters=20
RepeaterMaxMeters=30
RifleMaxMeters=40
SniperMaxMeters=50
ShotgunMaxMeters=20
CloseMeters=10
; Chances: 0-1000; 650 = 65%.
FirstHitChancePermille=650
RepeatHitChancePermille=800
; Used when TerminalThirdHit=0.
ThirdHitChancePermille=750
ShotgunSupplementChancePermille=250
; Same-hole radius: 0.02 = 2 cm; normal dot range 0-1.
SameHoleRadiusMeters=0.02
SameHoleMinimumNormalDot=0.5
; First-hit boost for high-velocity and split-point ammunition.
FirstHitAmmoBoostPermille=200
TerminalThirdHit=1
EvolutionPriority=1

; Vulkan / DX12 capacity. Per-ped limit: 128/256/512; shared pool: 1500-6000.
[Patch]
Enabled=1
DecalLimit=512
SharedPoolLimit=6000

; Draw bullet wounds above blood.
[BulletHoles]
; Focused bleeding capture avoids unrelated per-frame priority diagnostics.
DrawOverBlood=1

; PED BLOOD - NPC neck and front stomach have separate animation settings.
; Head controls face/head; Body controls chest/back/pelvis and stomach size/washing.
; Size: VerySmall / Small / Normal / Large / VeryLarge.
; Speeds: VerySlow / Slow / Normal / Fast / VeryFast.
; Mode=Custom accepts exact size, starting blood and wash ranges instead.
; Spread/soaking seconds and slowdown below work in both Preset and Custom.
; Exact seconds override BleedingSpeed even in Preset mode; Size and WashingSpeed still apply.
; BleedingSpeed is a fallback only when the exact duration rows are absent.
; Seconds and slowdown use minimum, maximum intervals, chosen once per new blood layer.
; Seconds: 0-5. Slowdown: 0=even speed; higher=faster start and slower finish; 0-8.
; A single slowdown value keeps every new layer at that fixed strength.
; Higher slowdown means a faster beginning and gentler finish; duration stays fixed.
; NeckBlood sets ordinary neck animation only; heavy/runoff clocks stay separate.
; Presets keep four weapon-driven tiers and random ranges. Restart after edits.
[BleedingRunoff]
; Head/neck bleeding travels gradually down the same body surface.
Enabled=1
Extended=1
BriefSpurtTier=2
Tier=3
NeckDelaySeconds=0.30, 0.50
UpperBodyDelaySeconds=1.00
LowerBodyDelaySeconds=1.20
AbdomenFlowSeconds=6.00

[NeckBlood]
; NPC local neck blood. Player blood stays separate.
Enabled=1
SizeMultiplier=1.20
;                           Minimum, Maximum
InitialSpreadPercent       = 40,      50
InitialBloodAmountPercent  = 30,      40
SpreadTimeSeconds          = 1.20,    1.70
CentreSpreadSlowdown       = 1.40,    1.80
SoakTimeSeconds            = 1.70,    2.30
SoakingSlowdown            = 0.85,    1.10

[PedBloodStomachAnimation]
; NPC front lower torso only. Blood size/washing still use Body.
Enabled=1
;                           Minimum, Maximum
CentreSpreadSeconds        = 2.80,    3.50
CentreSpreadSlowdown       = 1.00,    1.40
SoakingSeconds             = 3.50,    4.60
SoakingSlowdown            = 0.65,    0.95

[BleedingBloodSize]
; Extra critical and observed bleeding size. High keeps the tested blood amounts.
; Intensity: Low / Medium / High / VeryHigh. Mode=Custom uses numeric multipliers.
Enabled=1
Mode=Preset
Intensity=High

[FixedBleeding]
; Delay local bleeding packs; broad instant overlays are optional.
GradualCompatibility=1
BroadOverlays=0
DelaySeconds=1.80

; Extra bleeding: NPCs only. Body-part tiers and bleeding size bonuses set final size.
; Speeds: VerySlow / Slow / Normal / Fast / VeryFast.
; Mode=Custom uses minimum, maximum pairs for CentreSpreadSeconds,
; SoakingSeconds, InitialSpreadPercent and InitialBloodAmountPercent.
; Seconds: 0-5. Initial percentages: 1-100. Both finish at 100%.
[CriticalBloodAnimation]
; Default: 1.20-1.60s spread / 1.60-2.20s soaking; slower body-part clocks are kept.
Mode=Preset
BleedingSpeed=Normal

[HeavyBleedingBlood]
; Sustained head/neck blood: 1.80-2.40s spread / 2.40-3.20s soaking.
Mode=Preset
BleedingSpeed=Normal

[BleedingRunoffNeck]
; Default: 2.00-2.60s spread / 2.60-3.40s soaking.
Mode=Preset
BleedingSpeed=Normal

[BleedingRunoffBody]
; Body runoff: 2.80-3.60s spread / 3.60-4.60s soaking.
Mode=Preset
BleedingSpeed=Normal

[PedBlood]
Enabled=1
; 0=original, 1=soaking, 2=centre outward, 3=centre + soaking.
RevealMode=3
; Tier increases add a fresh spreading and soaking layer.
FreshUpgradeLayers=1

