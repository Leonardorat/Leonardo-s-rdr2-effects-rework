; WEAPON DAMAGE / BLOOD PROGRESSION - visual points, not health damage.
; One sample per accepted hit. Nearby matching and weapon rules choose the four blood tiers.
[WeaponDamage]
Enabled=1
Tier2Points=3
Tier3Points=6
Tier4Points=10
; Minimum, maximum. Shotguns have their own buckshot and slug sections directly below.
HandgunPoints               = 1.50,    1.90
RepeaterPoints              = 2.50,    3.50
RiflePoints                 = 3.00,    4.00
SniperPoints                = 6.00,    8.00
ArrowPoints                 = 1.00,    1.00
MachineGunPoints            = 1.00,    1.40
; Explosives and special shells retain their separate existing rules.
PreserveHighestTier=1
ApplyBloodOnlyOnTierIncrease=1
StopAddingBloodAtTier4=1

; SHOTGUN - BUCKSHOT. Pellets share one shell; points blend smoothly with distance.
[WeaponDamageBuckshot]
; Distances are metres; point ranges are minimum, maximum.
CloseMeters=10
MediumMeters=20
FarMeters=35
ClosePoints                 = 7.00,    11.00
MediumPoints                = 3.50,    6.50
FarPoints                   = 1.00,    2.50
UnknownRangePoints          = 1.00,    2.50

; SHOTGUN - SLUG. One projectile; points blend smoothly with distance.
[WeaponDamageSlug]
; Distances are metres; point ranges are minimum, maximum.
CloseMeters=10
MediumMeters=20
FarMeters=35
ClosePoints                 = 7.00,    11.00
MediumPoints                = 4.00,    7.00
FarPoints                   = 2.50,    4.50
UnknownRangePoints          = 2.50,    4.50

; Nearby hits must match anatomy, side and surface; distances are centimetres.
[WeaponDamageNearbyHits]
BodyRadiusCm=10
HeadNeckRadiusCm=5
ArmRadiusCm=7.5
LegRadiusCm=7.5
HandRadiusCm=3
FootRadiusCm=3
; At body-part boundaries the smaller applicable radius is used.
SurfaceAngleToleranceDegrees=60

; Early bleeding uses one combined chance roll and grants a minimum tier without adding points.
[WeaponDamageEarlyBleeding]
Enabled=1
MinimumTier=2
CloseMeters=10
MediumMeters=20
; Chance reaches zero here; unknown distance gets no early boost.
MaximumMeters=30
HandgunCloseChancePercent=8
HandgunMediumChancePercent=3
RepeaterCloseChancePercent=12
RepeaterMediumChancePercent=6
HeadNeckChanceBonusPercent=12
; High velocity and split point are alternative ammo bonuses.
HighVelocityChanceBonusPercent=5
SplitPointChanceBonusPercent=5
MaximumChancePercent=35

; Authored approximate vital-zone blood boost; requires WeaponDamage.Enabled=1.
; Strength: VeryLow / Low / Normal / High / VeryHigh.
; For exact values use Mode=Custom, MinimumTier=2, BloodPointsMultiplier=1.5.
; This changes blood, not weapon damage or bullet-hole evolution.
[CriticalBleeding]
Enabled=1
Mode=Preset
Strength=Normal

; Only confirmed bleeding effects associated with this wound can promote it.
[WeaponDamageObservedBleeding]
Enabled=1
DrippingMinimumTier=1
BriefSpurtMinimumTier=2
SustainedSpurtMinimumTier=3
; Continuous flow duration before its blood tier is promoted (0.5-20 seconds).
LongFlowSeconds=4
LongFlowMinimumTier=4

[BloodArtwork]
; Native: original blood artwork with all spreading, soaking and progression features.
; Scenarios: varied artwork selected by wound and posture; included in the Custom Blood version.
Artwork=Native
; Keep FamilyDefault to use the animation suited to each design.
; Alternatives: CentreSoak, UnevenDownwardSoak. Regional sizes and timings still apply.
Animation=FamilyDefault
; Scenarios only: native 29 chance (0-100); the rest is shared equally by suitable custom designs.
; Dedicated heavy-runoff selection is unchanged. Restart after editing.
NativeChancePercent=50

[BloodEvolutionBody]
; Upgraded ordinary torso stains; first hits and shotguns retain their sizes.
; Minimum, maximum. Existing larger Custom sizes are never reduced.
Enabled=1
Tier2SizePercent=95, 115
Tier3SizePercent=135, 160
Tier4SizePercent=175, 200
