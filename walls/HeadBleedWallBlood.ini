; HeadBleed Wall Blood 0.17
; Requires ScriptHookRDR2, HeadBleed V2 Gore Framework and Improvements in Blood.
; Install this ASI and INI beside RDR2.exe. Story Mode only.
; T: wall test. Settings reload automatically; function-key shortcuts disabled.
[General]
Enabled=1
BodyShots=1
RangeMeters=45
WallDistanceMeters=4.5
DiagnosticHotkeys=1
ComparisonHotkey=0
; Set 1 to enable legacy F6/F8/F9/F10 controls.
FunctionHotkeys=0
Logging=0

[Rendering]
Mode=0
Profile=4
; Restore owned stains removed early by the engine, with bounded retries.
RestoreTraces=1
NativeDecals=1

[Blood]
Enabled=1
HeadshotStreams=15
BodyshotStreams=10
SplashSpecks=30
; Percentage of peripheral splashes that also produce runoff.
WetSplashPercent=100
SplashRadiusMeters=0.80
TraceSpacingMeters=0.0075
WidthScale=0.72
ColorStrength=2.4
FlowSeconds=18
; Retention after the flow period. Engine capacity still limits visibility.
TraceSeconds=300
MaxLengthMeters=4.0
SpeedMetersPerSecond=0.18

[Fragments]
Enabled=1
Model=p_meatchunk_sm01x
; 0-4 fragments per headshot. Body shots produce blood only.
; Random size, sliding duration and detachment. Cleanup 30s after landing.
SpeedMetersPerSecond=0.075

[Limits]
MaxFlows=384
MaxFragments=64
; Script retention budget, separate from the engine's shared decal pool.
MaxTraces=24576
MaxDirectDraws=1800
